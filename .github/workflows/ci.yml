name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (oxlint)
        run: npm run lint

      - name: Dead code (knip)
        run: npm run knip

      - name: Unit tests (vitest)
        run: npm run test

      - name: Build
        run: npm run build
        env:
          # Placeholders are deliberate. The build never contacts Supabase, and
          # these values ship to the browser anyway — there is nothing to
          # protect here, so CI doesn't need the real project's. If you ever do
          # want CI building against the real project, add them as repository
          # *variables* (vars.*), not secrets.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
